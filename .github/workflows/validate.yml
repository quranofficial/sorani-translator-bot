name: Sorani Bot Validation

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: sorani-bot-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system font and media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-core ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile and run diagnostics
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GLM_API_KEY: ${{ secrets.ZAI_API_KEY }}
          KURDISH_TTS_API_KEY: ${{ secrets.KURDISH_TTS_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$BOT_TOKEN" || { echo "::error::BOT_TOKEN secret is missing"; exit 1; }
          python -m py_compile bot.py
          python bot.py --check | tee startup-check.log
          grep -q "Sorani font: OK" startup-check.log
          if [ -n "$KURDISH_TTS_API_KEY" ]; then
            grep -q "Kurdish TTS: OK" startup-check.log
          else
            echo "::warning::KURDISH_TTS_API_KEY is not configured; Kurdish voice output is disabled."
          fi

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sorani-validation-${{ github.run_id }}
          path: startup-check.log
          if-no-files-found: warn
          retention-days: 14
