name: Sorani Bot Validation

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: sorani-bot-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system font and media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-core ffmpeg tesseract-ocr tesseract-ocr-ara tesseract-ocr-eng build-essential cmake libboost-all-dev

      - name: Cache Hugging Face acoustic and language models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-sorani-asr-${{ runner.os }}-v1
          restore-keys: |
            hf-sorani-asr-${{ runner.os }}-

      - name: Install CPU-only PyTorch
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2.0"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Compile and run diagnostics
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GLM_API_KEY: ${{ secrets.ZAI_API_KEY }}
          KURDISH_TTS_API_KEY: ${{ secrets.KURDISH_TTS_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$BOT_TOKEN" || { echo "::error::BOT_TOKEN secret is missing"; exit 1; }
          python -m py_compile bot.py
          python bot.py --check | tee startup-check.log
          grep -q "Sorani font: OK" startup-check.log
          python - <<'PY'
          import bot
          model, tokenizer, feature_extractor = bot.get_asr()
          assert model is not None and tokenizer is not None and feature_extractor is not None
          assert bot._asr_decoder is not None, "KenLM decoder did not load"
          print("Sorani acoustic model: OK")
          print("Sorani KenLM decoder: OK")
          PY
          if [ -n "$KURDISH_TTS_API_KEY" ]; then
            grep -q "Kurdish TTS: OK" startup-check.log
          else
            echo "::warning::KURDISH_TTS_API_KEY is not configured; Kurdish voice output is disabled."
          fi

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sorani-validation-${{ github.run_id }}
          path: startup-check.log
          if-no-files-found: warn
          retention-days: 14
